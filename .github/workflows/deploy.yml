name: Deploy to Vercel
# DORMANT: ECHO-OMEGA-PRIME org Actions are blocked (startup_failure / spend limit).
# Canonical deploy path is `npm run deploy` on FORGE or `bash scripts/install-deploy-watchdog.sh`.
# This workflow resumes when GHA billing is restored AND secrets.VERCEL_TOKEN is set.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_zltGa4jWp6vVNl2t98Z35wu3
  VERCEL_PROJECT_ID: prj_2TXVE8qVUP31WES235nOiz9SNpqA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Deploy (gitless CLI — bypasses Vercel git-author seat block)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run deploy
